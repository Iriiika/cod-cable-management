<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <h2 class="login-title">Авторизация</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="login-form-group">
                <label for="username" class="login-label">Имя пользователя</label>
                <input type="text" id="username" name="username" class="login-input" placeholder="Введите имя" required>
            </div>
            <div class="login-form-group">
                <label for="password" class="login-label">Пароль</label>
                <input type="password" id="password" name="password" class="login-input" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="login-submit">Вход</button>
        </form>
        {% if error %}
        <div class="login-error" id="login-error">{{ error }}</div>
        {% endif %}
        <button id="theme-toggle" class="login-theme-toggle">Переключить тему</button>
    </div>
    <footer class="login-footer">
        Автор: [ФИО студента]
    </footer>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
