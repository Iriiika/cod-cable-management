{% extends 'base.html' %}
  {% block title %}Сброс пароля{% endblock %}
  {% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset_password.css') }}">
  {% endblock %}
  {% block content %}
    <div class="reset-password-content content">
      <div class="reset-password-form-wrapper">
        <h2 class="reset-password-title">Сброс пароля</h2>
        <form method="POST" action="{{ url_for('reset_password') }}">
          <div class="reset-password-form-group">
            <label for="email" class="reset-password-label"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" name="email" class="filter-input reset-password-input" placeholder="Введите email" required>
          </div>
          <div class="reset-password-button-wrapper">
            <button type="submit" class="excel-btn reset-password-submit-btn"><i class="fas fa-lock"></i> Сбросить пароль</button>
          </div>
        </form>
        <p class="reset-password-info">Введите ваш email, чтобы получить ссылку для сброса пароля.</p>
      </div>
    </div>
  {% endblock %}
