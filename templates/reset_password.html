{% extends 'base.html' %}
{% block title %}{{ _('Сброс пароля') }}{% endblock %}
{% block css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reset_password.css') }}">
{% endblock %}
{% block content %}
  <div class="reset-password-content content">
    <div class="reset-password-form-wrapper">
      <h2 class="reset-password-title">{{ _('Сброс пароля') }}</h2>
      <form method="POST" action="{{ url_for('reset_password') }}">
        <div class="reset-password-form-group">
          <label for="email" class="reset-password-label"><i class="fas fa-envelope"></i> {{ _('Email') }}</label>
          <input type="email" id="email" name="email" class="filter-input reset-password-input" placeholder="{{ _('Введите email') }}" required>
        </div>
        <div class="reset-password-button-wrapper">
          <button type="submit" class="excel-btn reset-password-submit-btn">
            <i class="fas fa-lock"></i> {{ _('Сбросить пароль') }}
          </button>
        </div>
      </form>
      <p class="reset-password-info">{{ _('Введите ваш email, чтобы получить ссылку для сброса пароля.') }}</p>
    </div>
  </div>
{% endblock %}
