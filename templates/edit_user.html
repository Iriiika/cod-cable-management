{% extends 'base.html' %}
{% block title %}{{ _('Редактирование пользователя') }}{% endblock %}
{% block css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_user.css') }}">
{% endblock %}
{% block content %}
  <div class="edit-user-breadcrumbs breadcrumbs">
    <a href="{{ url_for('dashboard') }}">{{ _('Главная') }}</a> >
    <a href="{{ url_for('admin_dashboard') }}">{{ _('Админ-панель') }}</a> > {{ _('Редактирование пользователя') }}
  </div>
  <div class="edit-user-content content">
    <div class="edit-user-form-wrapper">
      <h2 class="edit-user-title">{{ _('Редактирование пользователя') }}</h2>
      <form method="POST" action="{{ url_for('edit_user') }}">
        <div class="edit-user-form-group">
          <label for="user_id" class="edit-user-label">
            <i class="fas fa-user"></i> {{ _('ID пользователя') }}
          </label>
          <input type="text" id="user_id" name="user_id" class="filter-input edit-user-input" placeholder="{{ _('Введите ID пользователя') }}" required>
        </div>
        <div class="edit-user-form-group">
          <label for="full_name" class="edit-user-label">
            <i class="fas fa-user"></i> {{ _('ФИО') }}
          </label>
          <input type="text" id="full_name" name="full_name" class="filter-input edit-user-input" placeholder="{{ _('Введите ФИО') }}" required>
        </div>
        <div class="edit-user-form-group">
          <label for="role" class="edit-user-label">
            <i class="fas fa-shield-alt"></i> {{ _('Роль') }}
          </label>
          <select id="role" name="role" class="filter-input edit-user-input" required>
            <option value="Администратор">{{ _('Администратор') }}</option>
            <option value="Инженер ЛВС">{{ _('Инженер ЛВС') }}</option>
            <option value="Наблюдатель">{{ _('Наблюдатель') }}</option>
          </select>
        </div>
        <div class="edit-user-form-group">
          <label for="login" class="edit-user-label">
            <i class="fas fa-id-card"></i> {{ _('Логин') }}
          </label>
          <input type="text" id="login" name="login" class="filter-input edit-user-input" placeholder="{{ _('Введите логин') }}" required>
        </div>
        <div class="edit-user-form-group">
          <label for="password" class="edit-user-label">
            <i class="fas fa-lock"></i> {{ _('Пароль (оставьте пустым, если не меняете)') }}
          </label>
          <input type="password" id="password" name="password" class="filter-input edit-user-input" placeholder="{{ _('Введите новый пароль') }}">
        </div>
        <div class="edit-user-form-group">
          <label for="email" class="edit-user-label">
            <i class="fas fa-envelope"></i> {{ _('Email') }}
          </label>
          <input type="email" id="email" name="email" class="filter-input edit-user-input" placeholder="{{ _('Введите email') }}" required>
        </div>
        <div class="edit-user-button-wrapper">
          <button type="submit" class="excel-btn edit-user-submit-btn">
            <i class="fas fa-save"></i> {{ _('Сохранить') }}
          </button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
